[project]
name = "musicstore-agent"
version = "0.1.0"
description = "Agente de atendimento da loja Empório da Música (WhatsApp), com SDK anthropic e tool use explícito"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "streamlit",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pypdf>=7.1.0",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "llm: chama a API da Anthropic (precisa de ANTHROPIC_API_KEY)",
    "e2e: conversas ponta a ponta e UI, chamam a API (precisa de ANTHROPIC_API_KEY)",
]
addopts = "-m 'not llm and not e2e'"
